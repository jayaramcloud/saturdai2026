<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0a0c0"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">The hermes config Flow</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">One command, four questions, one saved profile.</text>

  <g transform="translate(120,240)">
    <rect width="330" height="180" rx="18" fill="#5b7cfa" fill-opacity="0.16" stroke="#5b7cfa" stroke-width="2.5"/>
    <text x="24" y="40" font-size="15" font-weight="700" fill="#9db1fb">STEP 1</text>
    <text x="24" y="72" font-size="19" font-weight="700" fill="#ffffff">Run the command</text>
    <rect x="24" y="96" width="282" height="50" rx="8" fill="#0a0a14"/>
    <text x="40" y="128" font-size="15" font-family="monospace" fill="#9db1fb">$ hermes config</text>
  </g>

  <g transform="translate(510,240)">
    <rect width="330" height="180" rx="18" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="2.5"/>
    <text x="24" y="40" font-size="15" font-weight="700" fill="#5fd4c6">STEP 2</text>
    <text x="24" y="72" font-size="19" font-weight="700" fill="#ffffff">Choose &#8220;custom&#8221;</text>
    <text x="24" y="100" font-size="14" fill="#c0c0d0">Instead of a built-in</text>
    <text x="24" y="122" font-size="14" fill="#c0c0d0">OpenAI/Anthropic provider,</text>
    <text x="24" y="144" font-size="14" fill="#c0c0d0">point it anywhere you want.</text>
  </g>

  <g transform="translate(900,240)">
    <rect width="330" height="180" rx="18" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="2.5"/>
    <text x="24" y="40" font-size="15" font-weight="700" fill="#f3b978">STEP 3</text>
    <text x="24" y="72" font-size="19" font-weight="700" fill="#ffffff">Enter base URL + model</text>
    <text x="24" y="100" font-size="14" fill="#c0c0d0"><tspan font-family="monospace">http://localhost:8080/v1</tspan></text>
    <text x="24" y="122" font-size="14" fill="#c0c0d0">plus the model name your</text>
    <text x="24" y="144" font-size="14" fill="#c0c0d0"><tspan font-family="monospace">llama-server</tspan> is serving.</text>
  </g>

  <g transform="translate(1290,240)">
    <rect width="210" height="180" rx="18" fill="#ec4899" fill-opacity="0.16" stroke="#ec4899" stroke-width="2.5"/>
    <text x="24" y="40" font-size="15" font-weight="700" fill="#f5a8c9">STEP 4</text>
    <text x="24" y="72" font-size="19" font-weight="700" fill="#ffffff">Saved</text>
    <text x="24" y="100" font-size="14" fill="#c0c0d0">Written to Hermes&#8217;s</text>
    <text x="24" y="122" font-size="14" fill="#c0c0d0">config file &#8212; every</text>
    <text x="24" y="144" font-size="14" fill="#c0c0d0">future call reuses it.</text>
  </g>

  <path d="M450,330 L510,330" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <path d="M840,330 L900,330" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <path d="M1230,330 L1290,330" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow4)"/>

  <g transform="translate(160,540)">
    <rect width="1340" height="220" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="32" y="46" font-size="18" font-weight="700" fill="#ffffff">If the API key field is required but you don&#8217;t have one</text>
    <text x="32" y="82" font-size="15" fill="#c0c0d0">Local servers usually don&#8217;t check the key at all &#8212; a placeholder value like</text>
    <text x="32" y="106" font-size="15" fill="#c0c0d0"><tspan font-family="monospace">not-needed</tspan> or <tspan font-family="monospace">local</tspan> satisfies the config prompt without doing anything real.</text>
    <text x="32" y="150" font-size="15" fill="#c0c0d0">This is different from a hosted provider, where a wrong key produces an</text>
    <text x="32" y="174" font-size="15" fill="#c0c0d0">actual 401 error &#8212; worth remembering when something &#8220;just doesn&#8217;t connect.&#8221;</text>
  </g>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent &#183; Day 2: Fundamentals</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">4 / 10</text>
</svg>
