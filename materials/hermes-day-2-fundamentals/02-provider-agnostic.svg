<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4b5fd"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Hermes Doesn&#8217;t Care Where the Model Lives</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">It only needs one thing: an OpenAI-compatible /v1 endpoint.</text>

  <g transform="translate(650,260)">
    <rect width="300" height="140" rx="20" fill="#8b5cf6" fill-opacity="0.30" stroke="#c4b5fd" stroke-width="3"/>
    <text x="150" y="60" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">Hermes Agent</text>
    <text x="150" y="92" font-size="15" fill="#e9e4fc" text-anchor="middle">CLI agent, one config,</text>
    <text x="150" y="114" font-size="15" fill="#e9e4fc" text-anchor="middle">any /v1 endpoint underneath</text>
  </g>

  <path d="M700,400 C500,470 350,520 260,560" fill="none" stroke="#c4b5fd" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <path d="M800,400 L800,560" fill="none" stroke="#c4b5fd" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <path d="M900,400 C1100,470 1250,520 1340,560" fill="none" stroke="#c4b5fd" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <g transform="translate(120,560)">
    <rect width="280" height="180" rx="18" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="2.5"/>
    <text x="24" y="42" font-size="18" font-weight="700" fill="#5fd4c6">Local: DGX Spark</text>
    <text x="24" y="76" font-size="14" fill="#c0c0d0"><tspan font-family="monospace">llama-server</tspan> exposing an</text>
    <text x="24" y="98" font-size="14" fill="#c0c0d0">OpenAI-compatible /v1 route</text>
    <text x="24" y="132" font-size="14" fill="#c0c0d0">on our own hardware, no</text>
    <text x="24" y="154" font-size="14" fill="#c0c0d0">API key or internet needed</text>
  </g>

  <g transform="translate(660,560)">
    <rect width="280" height="180" rx="18" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="2.5"/>
    <text x="24" y="42" font-size="18" font-weight="700" fill="#f3b978">Local: Mac Mini</text>
    <text x="24" y="76" font-size="14" fill="#c0c0d0">Same idea, different box &#8212;</text>
    <text x="24" y="98" font-size="14" fill="#c0c0d0">a local OpenAI-compatible</text>
    <text x="24" y="120" font-size="14" fill="#c0c0d0">server running on Apple</text>
    <text x="24" y="142" font-size="14" fill="#c0c0d0">silicon</text>
  </g>

  <g transform="translate(1200,560)">
    <rect width="280" height="180" rx="18" fill="#5b7cfa" fill-opacity="0.16" stroke="#5b7cfa" stroke-width="2.5"/>
    <text x="24" y="42" font-size="18" font-weight="700" fill="#9db1fb">Cloud provider</text>
    <text x="24" y="76" font-size="14" fill="#c0c0d0">A hosted API &#8212; same shape</text>
    <text x="24" y="98" font-size="14" fill="#c0c0d0">of request/response, just</text>
    <text x="24" y="120" font-size="14" fill="#c0c0d0">reached over the internet</text>
    <text x="24" y="142" font-size="14" fill="#c0c0d0">with an API key</text>
  </g>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent &#183; Day 2: Fundamentals</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">2 / 10</text>
</svg>
