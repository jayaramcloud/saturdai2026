<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Small vs. Large: The Real Tradeoff</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Neither model is &#8220;better&#8221; &#8212; they&#8217;re suited to different jobs.</text>

  <g transform="translate(120,200)">
    <rect width="660" height="560" rx="18" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-opacity="0.5" stroke-width="2.5"/>
    <text x="30" y="55" font-size="16" font-weight="700" fill="#7be0a0">SMALL MODEL (e.g. 7B&#8211;8B)</text>
    <text x="30" y="95" font-size="26" font-weight="800" fill="#ffffff">Fast &amp; cheap</text>
    <g transform="translate(30,130)">
      <text y="0" font-size="16" fill="#bdeccb">&#10003; Low latency &#8212; near-instant replies</text>
      <text y="40" font-size="16" fill="#bdeccb">&#10003; Lower memory footprint per instance</text>
      <text y="80" font-size="16" fill="#bdeccb">&#10003; Great for lookups, formatting, routing</text>
      <text y="120" font-size="16" fill="#bdeccb">&#10003; Cheap to run many in parallel</text>
      <text y="170" font-size="16" fill="#f5b8b8">&#10007; Struggles with long multi-step reasoning</text>
      <text y="210" font-size="16" fill="#f5b8b8">&#10007; More likely to miss nuance or context</text>
    </g>
  </g>

  <g transform="translate(820,200)">
    <rect width="660" height="560" rx="18" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-opacity="0.5" stroke-width="2.5"/>
    <text x="30" y="55" font-size="16" font-weight="700" fill="#f3b978">LARGE MODEL (e.g. 30B&#8211;200B)</text>
    <text x="30" y="95" font-size="26" font-weight="800" fill="#ffffff">Deep &amp; capable</text>
    <g transform="translate(30,130)">
      <text y="0" font-size="16" fill="#fbdba8">&#10003; Stronger multi-step reasoning</text>
      <text y="40" font-size="16" fill="#fbdba8">&#10003; Better at nuance, ambiguity, edge cases</text>
      <text y="80" font-size="16" fill="#fbdba8">&#10003; More reliable on unfamiliar tasks</text>
      <text y="120" font-size="16" fill="#fbdba8">&#10007; Slower time-to-first-token</text>
      <text y="160" font-size="16" fill="#f5b8b8">&#10007; Larger memory footprint</text>
      <text y="200" font-size="16" fill="#f5b8b8">&#10007; Overkill (and slower) for simple lookups</text>
    </g>
  </g>

  <text x="800" y="815" font-size="16" fill="#8888aa" text-anchor="middle" font-style="italic">The fix isn&#8217;t picking one &#8212; it&#8217;s routing each prompt to whichever one actually needs to answer it.</text>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent &#8212; Day 3</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">3 / 10</text>
</svg>
