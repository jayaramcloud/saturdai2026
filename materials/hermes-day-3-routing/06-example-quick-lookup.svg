<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0a0c0"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Example: A Quick Factual Lookup</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Simple, self-contained, no reasoning chain required &#8212; a job for the small model.</text>

  <g transform="translate(80,220)">
    <rect width="640" height="200" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="30" y="40" font-size="15" font-weight="700" fill="#9db1fb">PROMPT</text>
    <text x="30" y="90" font-size="19" fill="#ffffff" font-family="monospace">"What time is it right now</text>
    <text x="30" y="120" font-size="19" fill="#ffffff" font-family="monospace">in Calgary and Bengaluru?"</text>
    <text x="30" y="165" font-size="14" fill="#8888aa">Single fact, single tool call, no follow-on steps.</text>
  </g>

  <path d="M760,320 L900,320" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(900,220)">
    <rect width="620" height="200" rx="16" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2.5"/>
    <text x="30" y="40" font-size="15" font-weight="700" fill="#7be0a0">ROUTED TO local-small (7B)</text>
    <text x="30" y="90" font-size="18" font-weight="700" fill="#ffffff">Why:</text>
    <text x="30" y="120" font-size="16" fill="#bdeccb">One tool call, no multi-step planning</text>
    <text x="30" y="145" font-size="16" fill="#bdeccb">needed &#8212; the small model just needs to</text>
    <text x="30" y="170" font-size="16" fill="#bdeccb">call the time tool and relay the result.</text>
  </g>

  <g transform="translate(80,460)">
    <rect width="1440" height="300" rx="16" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.4" stroke-width="2"/>
    <text x="30" y="45" font-size="16" font-weight="700" fill="#5fd4c6">WHAT WE&#8217;LL RUN LIVE</text>
    <text x="30" y="100" font-size="18" font-family="monospace" fill="#e0fff8">$ hermes -z "What time is it right now in Calgary and</text>
    <text x="30" y="130" font-size="18" font-family="monospace" fill="#e0fff8">Bengaluru?" --cli --provider local-small</text>
    <text x="30" y="185" font-size="15" fill="#c0f0e8">Measure the wall-clock time from prompt to answer &#8212;</text>
    <text x="30" y="210" font-size="15" fill="#c0f0e8">this is the baseline we&#8217;ll compare the large model against next.</text>
  </g>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent &#8212; Day 3</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">6 / 10</text>
</svg>
