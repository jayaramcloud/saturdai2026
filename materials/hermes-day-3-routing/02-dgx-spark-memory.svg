<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Why the DGX Spark Makes Routing Possible</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">128 GB of memory is enough to keep more than one model loaded at once.</text>

  <g transform="translate(80,200)">
    <rect width="700" height="560" rx="18" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="2.5"/>
    <text x="350" y="70" font-size="60" font-weight="800" fill="#c4b5fd" text-anchor="middle">128 GB</text>
    <text x="350" y="105" font-size="18" fill="#e9d4fd" text-anchor="middle">Unified Memory</text>
    <rect x="40" y="150" width="620" height="1" fill="#8b5cf6" fill-opacity="0.3"/>
    <text x="350" y="200" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Option A</text>
    <text x="350" y="235" font-size="17" fill="#e9d4fd" text-anchor="middle">Several 30B-parameter models</text>
    <text x="350" y="260" font-size="17" fill="#e9d4fd" text-anchor="middle">loaded side by side</text>
    <rect x="150" y="290" width="100" height="60" rx="8" fill="#8b5cf6" fill-opacity="0.35" stroke="#c4b5fd"/>
    <text x="200" y="326" font-size="14" fill="#ffffff" text-anchor="middle">30B</text>
    <rect x="260" y="290" width="100" height="60" rx="8" fill="#8b5cf6" fill-opacity="0.35" stroke="#c4b5fd"/>
    <text x="310" y="326" font-size="14" fill="#ffffff" text-anchor="middle">30B</text>
    <rect x="370" y="290" width="100" height="60" rx="8" fill="#8b5cf6" fill-opacity="0.35" stroke="#c4b5fd"/>
    <text x="420" y="326" font-size="14" fill="#ffffff" text-anchor="middle">30B</text>
    <rect x="40" y="390" width="620" height="1" fill="#8b5cf6" fill-opacity="0.3"/>
    <text x="350" y="440" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Option B</text>
    <text x="350" y="475" font-size="17" fill="#e9d4fd" text-anchor="middle">One much larger model instead</text>
    <rect x="150" y="505" width="420" height="60" rx="8" fill="#8b5cf6" fill-opacity="0.35" stroke="#c4b5fd"/>
    <text x="360" y="541" font-size="14" fill="#ffffff" text-anchor="middle">Up to ~200B parameters</text>
  </g>

  <g transform="translate(820,200)">
    <rect width="700" height="560" rx="18" fill="#0d9488" fill-opacity="0.10" stroke="#0d9488" stroke-opacity="0.5" stroke-width="2.5"/>
    <text x="30" y="55" font-size="16" font-weight="700" fill="#5fd4c6">HARDWARE</text>
    <text x="30" y="95" font-size="24" font-weight="800" fill="#ffffff">NVIDIA GB10 Grace Superchip</text>
    <text x="30" y="150" font-size="17" fill="#c0f0e8">6,144 CUDA cores</text>
    <text x="30" y="185" font-size="17" fill="#c0f0e8">1 Petaflop FP4 compute</text>
    <text x="30" y="230" font-size="17" fill="#c0f0e8">This is what turns &#8220;can I keep two</text>
    <text x="30" y="255" font-size="17" fill="#c0f0e8">models warm at once?&#8221; from a</text>
    <text x="30" y="280" font-size="17" fill="#c0f0e8">question into a routine decision.</text>
    <rect x="30" y="330" width="640" height="180" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="55" y="365" font-size="16" font-weight="700" fill="#7be0a0">Without enough memory</text>
    <text x="55" y="395" font-size="14.5" fill="#c0c0d0">Switching models means unloading one and</text>
    <text x="55" y="418" font-size="14.5" fill="#c0c0d0">loading another &#8212; seconds of dead time per</text>
    <text x="55" y="441" font-size="14.5" fill="#c0c0d0">switch, and no room to compare live.</text>
    <text x="55" y="475" font-size="14.5" fill="#c0c0d0">On the DGX Spark, both models just stay resident.</text>
  </g>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent &#8212; Day 3</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">2 / 10</text>
</svg>
