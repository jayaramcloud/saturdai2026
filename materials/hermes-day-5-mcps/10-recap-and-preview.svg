<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Recap &amp; What&#8217;s Next</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Hermes can now reach out, not just recall.</text>

  <rect x="112" y="200" width="660" height="440" rx="20" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="2.5"/>
  <text x="144" y="250" font-size="20" font-weight="800" fill="#5fd4c6">Today&#8217;s five takeaways</text>
  <text x="144" y="296" font-size="16" fill="#e0e0f0">1. MCP is one protocol connecting</text>
  <text x="164" y="320" font-size="16" fill="#e0e0f0">Hermes to many external systems.</text>
  <text x="144" y="360" font-size="16" fill="#e0e0f0">2. <tspan font-family="monospace" fill="#f3b978">hermes mcp add</tspan> registers a</text>
  <text x="164" y="384" font-size="16" fill="#e0e0f0">server in one line.</text>
  <text x="144" y="424" font-size="16" fill="#e0e0f0">3. PATH issues are the most common</text>
  <text x="164" y="448" font-size="16" fill="#e0e0f0">first failure &#8212; use absolute paths.</text>
  <text x="144" y="488" font-size="16" fill="#e0e0f0">4. Always verify a tool actually ran,</text>
  <text x="164" y="512" font-size="16" fill="#e0e0f0">don&#8217;t trust a confident answer.</text>
  <text x="144" y="552" font-size="16" fill="#e0e0f0">5. Every server is a capability grant &#8212;</text>
  <text x="164" y="576" font-size="16" fill="#e0e0f0">scope it narrowly.</text>

  <rect x="828" y="200" width="660" height="440" rx="20" fill="#8b5cf6" fill-opacity="0.16" stroke="#c4b5fd" stroke-width="3" filter="url(#glow)"/>
  <text x="860" y="250" font-size="20" font-weight="800" fill="#ffffff">Day 6: Tool Calling &amp; Agent Loops</text>
  <text x="860" y="296" font-size="16" fill="#e9e4fc">One tool call is easy. Tomorrow</text>
  <text x="860" y="320" font-size="16" fill="#e9e4fc">is about chaining several together</text>
  <text x="860" y="344" font-size="16" fill="#e9e4fc">into a real agent loop &#8212; call a tool,</text>
  <text x="860" y="368" font-size="16" fill="#e9e4fc">read the result, decide what&#8217;s next,</text>
  <text x="860" y="392" font-size="16" fill="#e9e4fc">and keep going until the task is</text>
  <text x="860" y="416" font-size="16" fill="#e9e4fc">actually finished.</text>
  <text x="860" y="470" font-size="16" fill="#c4b5fd" font-style="italic">Code execution, file I/O, and</text>
  <text x="860" y="494" font-size="16" fill="#c4b5fd" font-style="italic">delegating to subagents all included.</text>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent Day 5: MCPs for Hermes</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">10 / 10</text>
</svg>
