<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">A Real Gotcha: the PATH Problem</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">If Hermes can&#8217;t find your command, the server never starts.</text>

  <rect x="112" y="210" width="660" height="420" rx="20" fill="#f5576c" fill-opacity="0.14" stroke="#f5576c" stroke-width="2.5"/>
  <text x="144" y="260" font-size="20" font-weight="800" fill="#f5a3ac">&#10007; Breaks silently</text>
  <rect x="144" y="290" width="596" height="70" rx="10" fill="#1a1a2e" stroke="#33335a" stroke-width="2"/>
  <text x="164" y="332" font-size="16" font-family="monospace" fill="#e0e0f0">--command uvx</text>
  <text x="144" y="400" font-size="16" fill="#e0e0f0">Works fine in your own shell,</text>
  <text x="144" y="424" font-size="16" fill="#e0e0f0">where PATH includes wherever</text>
  <text x="144" y="448" font-size="16" fill="#e0e0f0">uvx was installed.</text>
  <text x="144" y="490" font-size="16" fill="#e0e0f0">But Hermes may run with a</text>
  <text x="144" y="514" font-size="16" fill="#e0e0f0">different, narrower PATH &#8212;</text>
  <text x="144" y="538" font-size="16" fill="#e0e0f0">and the tool call just fails.</text>

  <text x="800" y="440" font-size="34" fill="#a0a0c0" text-anchor="middle">&#8594;</text>

  <rect x="828" y="210" width="660" height="420" rx="20" fill="#16a34a" fill-opacity="0.16" stroke="#16a34a" stroke-width="2.5"/>
  <text x="860" y="260" font-size="20" font-weight="800" fill="#7ee0a0">&#10003; Use an absolute path</text>
  <rect x="860" y="290" width="596" height="70" rx="10" fill="#1a1a2e" stroke="#33335a" stroke-width="2"/>
  <text x="880" y="322" font-size="14" font-family="monospace" fill="#e0e0f0">--command /home/jay/.local/bin/uvx</text>
  <text x="880" y="346" font-size="14" font-family="monospace" fill="#e0e0f0">--args --with 'mcp&lt;1.10' mcp-server-time</text>
  <text x="860" y="400" font-size="16" fill="#e0e0f0">Point directly at the binary&#8217;s</text>
  <text x="860" y="424" font-size="16" fill="#e0e0f0">real location instead of relying</text>
  <text x="860" y="448" font-size="16" fill="#e0e0f0">on PATH resolution at all.</text>
  <text x="860" y="490" font-size="16" fill="#e0e0f0">Run <tspan font-family="monospace">which uvx</tspan> to find it,</text>
  <text x="860" y="514" font-size="16" fill="#e0e0f0">then register that exact path.</text>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent Day 5: MCPs for Hermes</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">5 / 10</text>
</svg>
