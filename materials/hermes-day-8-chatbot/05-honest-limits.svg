<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0a0c0"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">What We Got Wrong, and How to Fix It</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Tested against the live site, not just on paper.</text>

  <g transform="translate(100,210)">
    <rect width="640" height="470" rx="18" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="2.5"/>
    <text x="320" y="46" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A limit we found by testing</text>
    <text x="320" y="86" font-size="16" fill="#c0c0d0" text-anchor="middle">The built-in rate limit is only a speed bump</text>
    <text x="320" y="118" font-size="16" fill="#c0c0d0" text-anchor="middle"></text>
    <text x="320" y="150" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; Its counters live in each Worker copy's memory</text>
    <text x="320" y="182" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; Cloudflare runs many copies at once</text>
    <text x="320" y="214" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; In a live test, 10 quick requests from one</text>
    <text x="320" y="246" font-size="16" fill="#c0c0d0" text-anchor="middle">   address all succeeded, with the limit set to 8</text>
    <text x="320" y="278" font-size="16" fill="#c0c0d0" text-anchor="middle"></text>
    <text x="320" y="310" font-size="16" fill="#c0c0d0" text-anchor="middle">So the monthly spend limit on the key</text>
    <text x="320" y="342" font-size="16" fill="#c0c0d0" text-anchor="middle">is the control that really protects you.</text>
  </g>
  <g transform="translate(860,210)">
    <rect width="640" height="470" rx="18" fill="#8b5cf6" fill-opacity="0.14" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="320" y="46" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">How to make it stronger</text>
    <text x="320" y="86" font-size="16" fill="#c0c0d0" text-anchor="middle">Pick one, depending on how much traffic you expect</text>
    <text x="320" y="118" font-size="16" fill="#c0c0d0" text-anchor="middle"></text>
    <text x="320" y="150" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; Cloudflare rate-limiting rules (no code)</text>
    <text x="320" y="182" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; A Durable Object that counts per visitor</text>
    <text x="320" y="214" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; Turnstile, a free bot check on the page</text>
    <text x="320" y="246" font-size="16" fill="#c0c0d0" text-anchor="middle"></text>
    <text x="320" y="278" font-size="16" fill="#c0c0d0" text-anchor="middle">Also remember: API keys expire.</text>
    <text x="320" y="310" font-size="16" fill="#c0c0d0" text-anchor="middle">Rotate it and re-run the secret command.</text>
  </g>
  <text x="800" y="760" font-size="20" fill="#a0a0c0" text-anchor="middle">Report what testing actually showed, including the parts that did not work as hoped.</text>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent Day 8: Build a Chatbot</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">5 / 6</text>
</svg>
