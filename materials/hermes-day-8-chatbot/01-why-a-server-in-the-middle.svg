<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0a0c0"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Why a Chatbot Needs a Server in the Middle</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">The API key is the whole risk. Everything else is design.</text>

  <g transform="translate(100,220)">
    <rect width="640" height="460" rx="18" fill="#f5576c" fill-opacity="0.14" stroke="#f5576c" stroke-width="2.5"/>
    <text x="320" y="46" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">The tempting shortcut</text>
    <text x="320" y="86" font-size="16" fill="#c0c0d0" text-anchor="middle">Put the AI key in the web page's JavaScript</text>
    <text x="320" y="118" font-size="16" fill="#c0c0d0" text-anchor="middle"></text>
    <text x="320" y="150" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; The key ships to every visitor's browser</text>
    <text x="320" y="182" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; Anyone can copy it from View Source</text>
    <text x="320" y="214" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; They can spend your money, not just use your site</text>
    <text x="320" y="246" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; A key committed to a public repo is found by</text>
    <text x="320" y="278" font-size="16" fill="#c0c0d0" text-anchor="middle">   bots within minutes</text>
    <text x="320" y="310" font-size="16" fill="#c0c0d0" text-anchor="middle"></text>
    <text x="320" y="342" font-size="16" fill="#c0c0d0" text-anchor="middle">Never do this.</text>
  </g>
  <g transform="translate(860,220)">
    <rect width="640" height="460" rx="18" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a" stroke-width="2.5"/>
    <text x="320" y="46" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">The safe pattern</text>
    <text x="320" y="86" font-size="16" fill="#c0c0d0" text-anchor="middle">Put a small server in the middle</text>
    <text x="320" y="118" font-size="16" fill="#c0c0d0" text-anchor="middle"></text>
    <text x="320" y="150" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; The browser only talks to YOUR server</text>
    <text x="320" y="182" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; The server holds the key as a secret</text>
    <text x="320" y="214" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; The server checks every question first</text>
    <text x="320" y="246" font-size="16" fill="#c0c0d0" text-anchor="middle">&#8226; Visitors never see the key or raw errors</text>
    <text x="320" y="278" font-size="16" fill="#c0c0d0" text-anchor="middle"></text>
    <text x="320" y="310" font-size="16" fill="#c0c0d0" text-anchor="middle">Browser &#8594; Worker &#8594; AI &#8594; Worker &#8594; Browser</text>
  </g>
  <text x="800" y="460" font-size="34" font-weight="800" fill="#a0a0c0" text-anchor="middle">&#8594;</text>
  <text x="800" y="780" font-size="20" fill="#a0a0c0" text-anchor="middle">Rule one of any chatbot: the browser never calls the AI directly.</text>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent Day 8: Build a Chatbot</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">1 / 6</text>
</svg>
