<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0a0c0"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Six Days Down, One to Go</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Everything so far becomes one working agent today.</text>

  <!-- 6 pipeline steps -->
  <g font-size="14" font-weight="700">
    <!-- Day 2 -->
    <g transform="translate(80,300)">
      <rect width="190" height="140" rx="16" fill="#5b7cfa" fill-opacity="0.16" stroke="#5b7cfa" stroke-width="2.5"/>
      <text x="20" y="34" fill="#9db1fb">DAY 2</text>
      <text x="20" y="66" font-size="18" fill="#ffffff">Fundamentals</text>
      <text x="20" y="94" font-size="13" font-weight="400" fill="#c0c0d0">Hermes talking to</text>
      <text x="20" y="112" font-size="13" font-weight="400" fill="#c0c0d0">a local model.</text>
    </g>
    <!-- Day 3 -->
    <g transform="translate(300,300)">
      <rect width="190" height="140" rx="16" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="2.5"/>
      <text x="20" y="34" fill="#5fd4c6">DAY 3</text>
      <text x="20" y="66" font-size="18" fill="#ffffff">Routing</text>
      <text x="20" y="94" font-size="13" font-weight="400" fill="#c0c0d0">Right model for</text>
      <text x="20" y="112" font-size="13" font-weight="400" fill="#c0c0d0">the right job.</text>
    </g>
    <!-- Day 4 -->
    <g transform="translate(520,300)">
      <rect width="190" height="140" rx="16" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="2.5"/>
      <text x="20" y="34" fill="#f3b978">DAY 4</text>
      <text x="20" y="66" font-size="18" fill="#ffffff">RAG</text>
      <text x="20" y="94" font-size="13" font-weight="400" fill="#c0c0d0">Grounded in real</text>
      <text x="20" y="112" font-size="13" font-weight="400" fill="#c0c0d0">documents.</text>
    </g>
    <!-- Day 5 -->
    <g transform="translate(740,300)">
      <rect width="190" height="140" rx="16" fill="#ec4899" fill-opacity="0.16" stroke="#ec4899" stroke-width="2.5"/>
      <text x="20" y="34" fill="#f5a8c9">DAY 5</text>
      <text x="20" y="66" font-size="18" fill="#ffffff">MCPs</text>
      <text x="20" y="94" font-size="13" font-weight="400" fill="#c0c0d0">Connected to real</text>
      <text x="20" y="112" font-size="13" font-weight="400" fill="#c0c0d0">external systems.</text>
    </g>
    <!-- Day 6 -->
    <g transform="translate(960,300)">
      <rect width="190" height="140" rx="16" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-width="2.5"/>
      <text x="20" y="34" fill="#c4b5fd">DAY 6</text>
      <text x="20" y="66" font-size="18" fill="#ffffff">Tool Loops</text>
      <text x="20" y="94" font-size="13" font-weight="400" fill="#c0c0d0">Multi-step agent</text>
      <text x="20" y="112" font-size="13" font-weight="400" fill="#c0c0d0">behavior.</text>
    </g>
    <!-- Day 7 highlighted -->
    <g transform="translate(1180,290)">
      <rect width="340" height="160" rx="18" fill="#16a34a" fill-opacity="0.22" stroke="#16a34a" stroke-width="3"/>
      <text x="24" y="38" fill="#6ee7a0">DAY 7 &#8212; TODAY</text>
      <text x="24" y="76" font-size="24" fill="#ffffff">Deploy</text>
      <text x="24" y="104" font-size="14" font-weight="400" fill="#c0c0d0">All five pieces above, combined</text>
      <text x="24" y="124" font-size="14" font-weight="400" fill="#c0c0d0">into one agent that keeps running.</text>
    </g>
  </g>

  <path d="M270,370 L300,370" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M490,370 L520,370" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M710,370 L740,370" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M930,370 L960,370" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1150,370 L1180,370" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="80" y="560" width="1440" height="110" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="104" y="600" font-size="16" font-weight="700" fill="#f3b978">&#128273; Key idea</text>
  <text x="104" y="628" font-size="14" fill="#c0c0d0">None of the last five days were building separate toys &#8212; each one is a component of the same agent.</text>
  <text x="104" y="650" font-size="14" fill="#c0c0d0">Today we stop assembling parts and start running the whole thing, unattended, for real.</text>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent Day 7: Deploy</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">1 / 10</text>
</svg>
