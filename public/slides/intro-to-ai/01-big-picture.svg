<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Header (large type for readability) -->
  <text x="60" y="100" font-size="76" font-weight="800" fill="url(#titleGrad)">Who&#8217;s Doing What in AI</text>
  <text x="60" y="160" font-size="36" fill="#a0a0c0">A few labs build the models &#8212; everyone else uses them.</text>

  <!-- Block 0: Not Using AI Yet, outside the picture -->
  <rect x="60" y="215" width="290" height="530" rx="22" fill="#f5576c" fill-opacity="0.12" stroke="#f5576c" stroke-width="3" stroke-dasharray="12,8"/>
  <text x="205" y="330" font-size="72" text-anchor="middle">&#128694;</text>
  <text x="205" y="400" font-size="34" font-weight="700" fill="#ffb3bd" text-anchor="middle">Not Using</text>
  <text x="205" y="440" font-size="34" font-weight="700" fill="#ffb3bd" text-anchor="middle">AI Yet</text>
  <g font-size="26" fill="#c0c0d0" text-anchor="middle">
    <text x="205" y="510">Still on the</text>
    <text x="205" y="546">sidelines &#8212;</text>
    <text x="205" y="582">and the gap</text>
    <text x="205" y="618">grows daily.</text>
  </g>
  <circle cx="60" cy="215" r="28" fill="#f65af2" stroke="#0f0f1e" stroke-width="3"/>
  <text x="60" y="228" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>

  <!-- Block 1: People -->
  <g transform="translate(380,215)">
    <rect width="330" height="530" rx="26" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
    <text x="24" y="70" font-size="52">&#129489;</text>
    <text x="96" y="68" font-size="46" font-weight="700" fill="#9db1fb">People</text>
    <text x="26" y="120" font-size="27" fill="#a0a0c0">Drive, don&#8217;t build</text>

    <!-- Personal life -->
    <rect x="18" y="160" width="294" height="190" rx="18" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="3"/>
    <text x="165" y="226" font-size="48" text-anchor="middle">&#129489;</text>
    <text x="165" y="272" font-size="30" font-weight="700" fill="#c4b5fd" text-anchor="middle">Personal Life</text>
    <text x="165" y="310" font-size="25" fill="#d8d8e8" text-anchor="middle">Learn &amp; grow with AI</text>
    <circle cx="18" cy="160" r="28" fill="#f65af2" stroke="#0f0f1e" stroke-width="3"/>
    <text x="18" y="173" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  <!-- Block 2/3: Enterprises Building With AI -->
  <g transform="translate(740,215)">
    <rect width="430" height="530" rx="26" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-width="3"/>
    <text x="24" y="70" font-size="50">&#127970;</text>
    <text x="96" y="68" font-size="44" font-weight="700" fill="#f3b978">Enterprises</text>
    <text x="26" y="112" font-size="27" fill="#a0a0c0">Building with AI</text>
    <g font-size="28" fill="#d0d0e0">
      <text x="26" y="156">&#8226; On-prem or cloud</text>
      <text x="26" y="194">&#8226; Harness + MCP + tools</text>
      <text x="26" y="232">&#8226; AI over private data</text>
    </g>

    <!-- Professional cards: fully inside Enterprises -->
    <rect x="18" y="262" width="394" height="116" rx="18" fill="#5b7cfa" fill-opacity="0.26" stroke="#5b7cfa" stroke-width="3"/>
    <text x="60" y="336" font-size="44" text-anchor="middle">&#128188;</text>
    <text x="100" y="312" font-size="30" font-weight="700" fill="#ffffff">Professional Life</text>
    <text x="100" y="352" font-size="25" fill="#e9e4fc">Be a 5x engineer</text>
    <circle cx="18" cy="262" r="28" fill="#f65af2" stroke="#0f0f1e" stroke-width="3"/>
    <text x="18" y="275" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

    <rect x="18" y="396" width="394" height="116" rx="18" fill="#5b7cfa" fill-opacity="0.26" stroke="#5b7cfa" stroke-width="3"/>
    <text x="60" y="470" font-size="44" text-anchor="middle">&#128104;&#8205;&#128187;</text>
    <text x="100" y="446" font-size="30" font-weight="700" fill="#ffffff">Building AI</text>
    <text x="100" y="486" font-size="25" fill="#e9e4fc">for companies, inside</text>
    <circle cx="18" cy="396" r="28" fill="#f65af2" stroke="#0f0f1e" stroke-width="3"/>
    <text x="18" y="409" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  </g>

  <!-- Block 4: AI Builders -->
  <g transform="translate(1200,215)">
    <rect width="340" height="530" rx="26" fill="#0d9488" fill-opacity="0.10" stroke="#0d9488" stroke-width="3"/>
    <text x="22" y="70" font-size="48">&#128300;</text>
    <text x="88" y="68" font-size="42" font-weight="700" fill="#5fd4c6">AI Builders</text>
    <g font-size="25" fill="#a0a0c0">
      <text x="26" y="112">OpenAI &#183; Anthropic</text>
      <text x="26" y="146">Gemini &#183; DeepSeek</text>
    </g>
    <g font-size="28" fill="#d0d0e0">
      <text x="26" y="200">&#8226; PhD research</text>
      <text x="26" y="240">&#8226; Train from scratch</text>
      <text x="26" y="280">&#8226; Massive compute</text>
      <text x="26" y="320">&#8226; Push the frontier</text>
    </g>

    <!-- Person: the researcher/builder, badge 4 -->
    <text x="190" y="470" font-size="96" text-anchor="middle">&#129489;&#8205;&#128300;</text>
    <circle cx="112" cy="400" r="28" fill="#f65af2" stroke="#0f0f1e" stroke-width="3"/>
    <text x="112" y="413" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
  </g>

  <!-- Car analogy strip -->
  <rect x="60" y="770" width="1480" height="70" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="800" y="815" font-size="28" fill="#c0c0d0" text-anchor="middle"><tspan font-weight="700" fill="#ffffff">Car analogy:</tspan>  &#128664; <tspan fill="#9db1fb">people drive</tspan>  &#183;  &#128295; <tspan fill="#f3b978">enterprises assemble</tspan>  &#183;  &#127959;&#65039; <tspan fill="#5fd4c6">builders design the engine</tspan></text>

  <!-- Footer -->
  <text x="60" y="882" font-size="22" fill="#8888aa">SaturdAI &#183; Intro to AI</text>
  <text x="1540" y="882" font-size="22" fill="#8888aa" text-anchor="end">1 / 10</text>
</svg>
