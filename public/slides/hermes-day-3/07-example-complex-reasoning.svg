<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0a0c0"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Example: A Multi-Step Reasoning Task</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Several dependent steps and judgment calls &#8212; worth paying the latency cost for a stronger model.</text>

  <g transform="translate(80,220)">
    <rect width="640" height="200" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="30" y="40" font-size="15" font-weight="700" fill="#9db1fb">PROMPT</text>
    <text x="30" y="85" font-size="16" fill="#ffffff" font-family="monospace">"Read these two vendor quotes, compare</text>
    <text x="30" y="112" font-size="16" fill="#ffffff" font-family="monospace">their tradeoffs, and recommend one with</text>
    <text x="30" y="139" font-size="16" fill="#ffffff" font-family="monospace">reasoning."</text>
    <text x="30" y="175" font-size="14" fill="#8888aa">Read, compare, weigh tradeoffs, justify a decision.</text>
  </g>

  <path d="M760,320 L900,320" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(900,220)">
    <rect width="620" height="200" rx="16" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="2.5"/>
    <text x="30" y="40" font-size="15" font-weight="700" fill="#f3b978">ROUTED TO local-large (30B)</text>
    <text x="30" y="90" font-size="18" font-weight="700" fill="#ffffff">Why:</text>
    <text x="30" y="120" font-size="16" fill="#fbdba8">Multiple dependent reasoning steps &#8212;</text>
    <text x="30" y="145" font-size="16" fill="#fbdba8">the small model tends to skip the</text>
    <text x="30" y="170" font-size="16" fill="#fbdba8">comparison step and just pick one.</text>
  </g>

  <g transform="translate(80,460)">
    <rect width="1440" height="300" rx="16" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.4" stroke-width="2"/>
    <text x="30" y="45" font-size="16" font-weight="700" fill="#5fd4c6">WHAT WE&#8217;LL RUN LIVE</text>
    <text x="30" y="100" font-size="17" font-family="monospace" fill="#e0fff8">$ hermes -z "Compare these two vendor quotes and</text>
    <text x="30" y="130" font-size="17" font-family="monospace" fill="#e0fff8">recommend one, with reasoning." --cli --provider local-large</text>
    <text x="30" y="185" font-size="15" fill="#c0f0e8">Same stopwatch as the last slide &#8212; expect a slower response,</text>
    <text x="30" y="210" font-size="15" fill="#c0f0e8">but check whether the reasoning actually holds up.</text>
  </g>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent &#8212; Day 3</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">7 / 10</text>
</svg>
