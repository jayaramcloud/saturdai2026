<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Chunking Basics</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Chunk size decides what actually gets retrieved.</text>

  <!-- Small chunks -->
  <rect x="80" y="200" width="670" height="540" rx="22" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="2.5"/>
  <text x="112" y="250" font-size="14" font-weight="700" fill="#5fd4c6">SMALL CHUNKS</text>
  <text x="112" y="290" font-size="22" font-weight="800" fill="#ffffff">Precise, but narrow</text>

  <rect x="112" y="320" width="150" height="60" rx="8" fill="#ffffff" fill-opacity="0.10"/>
  <rect x="272" y="320" width="150" height="60" rx="8" fill="#ffffff" fill-opacity="0.10"/>
  <rect x="432" y="320" width="150" height="60" rx="8" fill="#ffffff" fill-opacity="0.10"/>
  <text x="187" y="356" font-size="12" fill="#c0e8e0" text-anchor="middle">chunk</text>
  <text x="347" y="356" font-size="12" fill="#c0e8e0" text-anchor="middle">chunk</text>
  <text x="507" y="356" font-size="12" fill="#c0e8e0" text-anchor="middle">chunk</text>

  <text x="112" y="440" font-size="16" fill="#c0e8e0">+ Retrieval pinpoints the exact sentence</text>
  <text x="112" y="466" font-size="16" fill="#c0e8e0">&nbsp;&nbsp;that matters</text>
  <text x="112" y="510" font-size="16" fill="#f5c8b8">&#8722; Loses surrounding context &#8212; a chunk can</text>
  <text x="112" y="536" font-size="16" fill="#f5c8b8">&nbsp;&nbsp;read as true in isolation but misleading</text>
  <text x="112" y="562" font-size="16" fill="#f5c8b8">&nbsp;&nbsp;without its neighbors</text>

  <rect x="112" y="610" width="606" height="90" rx="12" fill="#ffffff" fill-opacity="0.06"/>
  <text x="132" y="640" font-size="14" font-weight="700" fill="#5fd4c6">EXAMPLE</text>
  <text x="132" y="664" font-size="14" fill="#c0e8e0">A one-sentence chunk about "mcpo bridge" without the</text>
  <text x="132" y="686" font-size="14" fill="#c0e8e0">setup steps around it.</text>

  <!-- Large chunks -->
  <rect x="850" y="200" width="670" height="540" rx="22" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="2.5"/>
  <text x="882" y="250" font-size="14" font-weight="700" fill="#f3b978">LARGE CHUNKS</text>
  <text x="882" y="290" font-size="22" font-weight="800" fill="#ffffff">Broad, but noisy</text>

  <rect x="882" y="320" width="606" height="60" rx="8" fill="#ffffff" fill-opacity="0.10"/>
  <text x="1185" y="356" font-size="12" fill="#f7d9ab" text-anchor="middle">one large chunk</text>

  <text x="882" y="440" font-size="16" fill="#f7d9ab">+ Keeps full context around the answer</text>
  <text x="882" y="510" font-size="16" fill="#f5c8b8">&#8722; Retrieval brings back a lot of text the</text>
  <text x="882" y="536" font-size="16" fill="#f5c8b8">&nbsp;&nbsp;question didn&#8217;t ask about, diluting the</text>
  <text x="882" y="562" font-size="16" fill="#f5c8b8">&nbsp;&nbsp;signal and using up context window</text>

  <rect x="882" y="610" width="606" height="90" rx="12" fill="#ffffff" fill-opacity="0.06"/>
  <text x="902" y="640" font-size="14" font-weight="700" fill="#f3b978">EXAMPLE</text>
  <text x="902" y="664" font-size="14" fill="#f7d9ab">A whole doc page as one chunk when only one paragraph</text>
  <text x="902" y="686" font-size="14" fill="#f7d9ab">actually answered the question.</text>

  <text x="80" y="866" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent &#183; Day 4: RAG</text>
  <text x="1520" y="866" font-size="14" fill="#8888aa" text-anchor="end">8 / 10</text>
</svg>
