<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0a0c0"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">The Four-Step Cycle</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Every agent loop, no matter how complex, is this cycle repeating.</text>

  <!-- Circular arrangement of 4 nodes around a center -->
  <circle cx="800" cy="500" r="260" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="4 8"/>

  <g transform="translate(650,220)">
    <rect width="300" height="130" rx="18" fill="#5b7cfa" fill-opacity="0.16" stroke="#5b7cfa" stroke-width="2.5"/>
    <text x="24" y="36" font-size="14" font-weight="700" fill="#9db1fb">1. CALL TOOL</text>
    <text x="24" y="66" font-size="15" fill="#ffffff" font-weight="700">Hermes picks a tool</text>
    <text x="24" y="90" font-size="13" fill="#c0c0d0">and fills in its arguments.</text>
  </g>

  <g transform="translate(1020,470)">
    <rect width="300" height="130" rx="18" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="2.5"/>
    <text x="24" y="36" font-size="14" font-weight="700" fill="#5fd4c6">2. OBSERVE RESULT</text>
    <text x="24" y="66" font-size="15" fill="#ffffff" font-weight="700">Reads what came back</text>
    <text x="24" y="90" font-size="13" fill="#c0c0d0">success, error, or data.</text>
  </g>

  <g transform="translate(650,720)">
    <rect width="300" height="130" rx="18" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="2.5"/>
    <text x="24" y="36" font-size="14" font-weight="700" fill="#f3b978">3. DECIDE NEXT STEP</text>
    <text x="24" y="66" font-size="15" fill="#ffffff" font-weight="700">Enough to answer, or</text>
    <text x="24" y="90" font-size="13" fill="#c0c0d0">is another tool needed?</text>
  </g>

  <g transform="translate(280,470)">
    <rect width="300" height="130" rx="18" fill="#ec4899" fill-opacity="0.16" stroke="#ec4899" stroke-width="2.5"/>
    <text x="24" y="36" font-size="14" font-weight="700" fill="#f5a8c9">4. REPEAT OR STOP</text>
    <text x="24" y="66" font-size="15" fill="#ffffff" font-weight="700">Loops back to step 1,</text>
    <text x="24" y="90" font-size="13" fill="#c0c0d0">or produces the final answer.</text>
  </g>

  <path d="M950,350 C1010,390 1040,410 1080,470" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1140,600 C1080,660 1000,700 950,730" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M650,780 C560,760 480,700 450,600" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M420,470 C480,410 560,370 650,350" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1080" y="60" width="440" height="110" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="1104" y="98" font-size="16" font-weight="700" fill="#f3b978">🔁 Key idea</text>
  <text x="1104" y="126" font-size="14" fill="#c0c0d0">"Loop" doesn't mean forever — step 3 is</text>
  <text x="1104" y="148" font-size="14" fill="#c0c0d0">where Hermes chooses to stop and answer.</text>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Day 6: Tool Calling &amp; Agent Loops</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">3 / 10</text>
</svg>
