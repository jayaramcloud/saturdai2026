<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0a0c0"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Single Call vs. Agent Loop</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Same building block, very different shape once it repeats.</text>

  <text x="150" y="210" font-size="20" font-weight="700" fill="#5b7cfa">SINGLE TOOL CALL</text>
  <g transform="translate(100,240)">
    <rect width="260" height="90" rx="14" fill="#5b7cfa" fill-opacity="0.16" stroke="#5b7cfa" stroke-width="2"/>
    <text x="130" y="50" font-size="16" fill="#ffffff" text-anchor="middle">Ask</text>
  </g>
  <path d="M360,285 L460,285" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(460,240)">
    <rect width="260" height="90" rx="14" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="2"/>
    <text x="130" y="50" font-size="16" fill="#ffffff" text-anchor="middle">Call tool</text>
  </g>
  <path d="M720,285 L820,285" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(820,240)">
    <rect width="260" height="90" rx="14" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="2"/>
    <text x="130" y="50" font-size="16" fill="#ffffff" text-anchor="middle">Answer</text>
  </g>
  <text x="150" y="380" font-size="15" fill="#8888aa">One decision, one result, done. Fine for "what time is it in Tokyo?"</text>

  <line x1="100" y1="440" x2="1500" y2="440" stroke="#ffffff" stroke-opacity="0.1"/>

  <text x="150" y="500" font-size="20" font-weight="700" fill="#8b5cf6">AGENT LOOP</text>
  <g transform="translate(100,530)">
    <rect width="230" height="90" rx="14" fill="#5b7cfa" fill-opacity="0.16" stroke="#5b7cfa" stroke-width="2"/>
    <text x="115" y="50" font-size="15" fill="#ffffff" text-anchor="middle">Ask</text>
  </g>
  <path d="M330,575 L410,575" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(410,530)">
    <rect width="230" height="90" rx="14" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="2"/>
    <text x="115" y="50" font-size="15" fill="#ffffff" text-anchor="middle">Call tool</text>
  </g>
  <path d="M640,575 L720,575" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(720,530)">
    <rect width="230" height="90" rx="14" fill="#ec4899" fill-opacity="0.16" stroke="#ec4899" stroke-width="2"/>
    <text x="115" y="50" font-size="15" fill="#ffffff" text-anchor="middle">Observe result</text>
  </g>
  <path d="M950,575 L1030,575" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(1030,530)">
    <rect width="230" height="90" rx="14" fill="#16a34a" fill-opacity="0.16" stroke="#16a34a" stroke-width="2"/>
    <text x="115" y="42" font-size="15" fill="#ffffff" text-anchor="middle">Need another</text>
    <text x="115" y="64" font-size="15" fill="#ffffff" text-anchor="middle">tool?</text>
  </g>
  <path d="M1145,530 C1145,460 640,460 525,530" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="700" y="460" font-size="14" fill="#f3b978" font-style="italic">yes → loop back</text>
  <path d="M1260,620 L1260,660" fill="none" stroke="#a0a0c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(1090,660)">
    <rect width="340" height="90" rx="14" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="2"/>
    <text x="170" y="50" font-size="15" fill="#ffffff" text-anchor="middle">no → final answer</text>
  </g>
  <text x="150" y="820" font-size="15" fill="#8888aa">Repeats until Hermes decides the task is actually finished — not just one shot.</text>

  <text x="80" y="870" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Day 6: Tool Calling &amp; Agent Loops</text>
  <text x="1520" y="870" font-size="14" fill="#8888aa" text-anchor="end">2 / 10</text>
</svg>
