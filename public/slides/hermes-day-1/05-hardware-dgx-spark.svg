<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Our Hardware: DGX Spark</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Powered on here in Calgary, three months ago, following Sanjay Jayaram&#8217;s vision.</text>

  <!-- Chip visual -->
  <rect x="130" y="200" width="360" height="360" rx="24" fill="#16a34a" fill-opacity="0.14" stroke="#7ee2a0" stroke-width="2.5"/>
  <rect x="190" y="260" width="240" height="240" rx="16" fill="#0f0f1e" stroke="#7ee2a0" stroke-width="2" filter="url(#glow2)"/>
  <text x="310" y="370" font-size="16" font-weight="700" fill="#7ee2a0" text-anchor="middle">NVIDIA&#174;</text>
  <text x="310" y="396" font-size="16" font-weight="700" fill="#7ee2a0" text-anchor="middle">GB10 Grace</text>
  <text x="310" y="422" font-size="16" font-weight="700" fill="#7ee2a0" text-anchor="middle">Superchip</text>

  <!-- Spec cards -->
  <rect x="560" y="200" width="440" height="160" rx="18" fill="#5b7cfa" fill-opacity="0.14" stroke="#5b7cfa" stroke-width="2.5"/>
  <text x="780" y="270" font-size="44" font-weight="800" fill="#9db1fb" text-anchor="middle">128 GB</text>
  <text x="780" y="305" font-size="17" fill="#a0a0c0" text-anchor="middle">Unified memory</text>

  <rect x="1040" y="200" width="440" height="160" rx="18" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="2.5"/>
  <text x="1260" y="270" font-size="44" font-weight="800" fill="#5fd4c6" text-anchor="middle">6,144</text>
  <text x="1260" y="305" font-size="17" fill="#a0a0c0" text-anchor="middle">CUDA cores</text>

  <rect x="560" y="400" width="440" height="160" rx="18" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="2.5"/>
  <text x="780" y="470" font-size="44" font-weight="800" fill="#f3b978" text-anchor="middle">1 PFLOP</text>
  <text x="780" y="505" font-size="17" fill="#a0a0c0" text-anchor="middle">FP4 compute</text>

  <rect x="1040" y="400" width="440" height="160" rx="18" fill="#8b5cf6" fill-opacity="0.20" stroke="#c4b5fd" stroke-width="2.5"/>
  <text x="1260" y="470" font-size="44" font-weight="800" fill="#c4b5fd" text-anchor="middle">200B</text>
  <text x="1260" y="505" font-size="17" fill="#a0a0c0" text-anchor="middle">Max params (single model)</text>

  <!-- Footnote -->
  <rect x="130" y="620" width="1350" height="140" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="805" y="668" font-size="18" fill="#ffffff" text-anchor="middle">Enough to run a single 200-billion-parameter model, or several 30-billion-parameter</text>
  <text x="805" y="696" font-size="18" fill="#ffffff" text-anchor="middle">LLMs side by side &#8212; which is exactly what we&#8217;ll do on Day 3 (LLM Routing).</text>
  <text x="805" y="732" font-size="15" fill="#8888aa" text-anchor="middle">We&#8217;ll share remote access with everyone joining the live sessions.</text>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Day 1: Intro to LLMs and Hermes</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">5 / 10</text>
</svg>
