<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Local vs. Cloud Endpoint</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Same Hermes CLI, same commands &#8212; the only thing that changes is the base URL.</text>

  <g transform="translate(140,200)">
    <rect width="640" height="600" rx="22" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="2.5"/>
    <text x="32" y="52" font-size="24" font-weight="700" fill="#5fd4c6">Local (DGX Spark)</text>
    <text x="32" y="110" font-size="16" fill="#ffffff">🖥️ Runs on our own hardware</text>
    <text x="32" y="150" font-size="16" fill="#ffffff">🔌 No API key required</text>
    <text x="32" y="190" font-size="16" fill="#ffffff">📡 Works fully offline</text>
    <text x="32" y="230" font-size="16" fill="#ffffff">🔒 Data never leaves our network</text>
    <text x="32" y="270" font-size="16" fill="#ffffff">🧠 Model size limited by our GPU memory</text>
    <text x="32" y="330" font-size="15" fill="#c0c0d0">Base URL example:</text>
    <rect x="32" y="350" width="576" height="56" rx="10" fill="#0a0a14"/>
    <text x="52" y="386" font-size="16" font-family="monospace" fill="#7be0a0">http://localhost:8080/v1</text>
    <text x="32" y="450" font-size="15" fill="#c0c0d0">What we&#8217;ll actually use today.</text>
  </g>

  <g transform="translate(820,200)">
    <rect width="640" height="600" rx="22" fill="#5b7cfa" fill-opacity="0.14" stroke="#5b7cfa" stroke-width="2.5"/>
    <text x="32" y="52" font-size="24" font-weight="700" fill="#9db1fb">Cloud (hosted API)</text>
    <text x="32" y="110" font-size="16" fill="#ffffff">☁️ Runs on someone else&#8217;s servers</text>
    <text x="32" y="150" font-size="16" fill="#ffffff">🔑 Needs an API key and billing</text>
    <text x="32" y="190" font-size="16" fill="#ffffff">📡 Needs an internet connection</text>
    <text x="32" y="230" font-size="16" fill="#ffffff">🔓 Requests leave your machine</text>
    <text x="32" y="270" font-size="16" fill="#ffffff">🧠 Model size limited only by the provider</text>
    <text x="32" y="330" font-size="15" fill="#c0c0d0">Base URL example:</text>
    <rect x="32" y="350" width="576" height="56" rx="10" fill="#0a0a14"/>
    <text x="52" y="386" font-size="16" font-family="monospace" fill="#9db1fb">https://api.openai.com/v1</text>
    <text x="32" y="450" font-size="15" fill="#c0c0d0">Also works with Hermes &#8212; not used today.</text>
  </g>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent &#183; Day 2: Fundamentals</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">3 / 10</text>
</svg>
