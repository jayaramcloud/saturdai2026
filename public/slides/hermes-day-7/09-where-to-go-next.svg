<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Where to Go From Here</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">The course ends today &#8212; your agent doesn&#8217;t have to.</text>

  <g font-size="16">
    <g transform="translate(100,220)">
      <rect width="700" height="130" rx="16" fill="#5b7cfa" fill-opacity="0.16" stroke="#5b7cfa" stroke-width="2.5"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#ffffff">Add more MCP servers</text>
      <text x="24" y="74" font-size="14" fill="#c0c0d0">Calendar, email, GitHub, your own APIs &#8212;</text>
      <text x="24" y="96" font-size="14" fill="#c0c0d0">Day 5&#8217;s pattern extends to anything with an MCP server.</text>
    </g>
    <g transform="translate(820,220)">
      <rect width="700" height="130" rx="16" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="2.5"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#ffffff">Expand the RAG collection</text>
      <text x="24" y="74" font-size="14" fill="#c0c0d0">Point Day 4&#8217;s ChromaDB setup at your own</text>
      <text x="24" y="96" font-size="14" fill="#c0c0d0">notes, docs, or codebase.</text>
    </g>
    <g transform="translate(100,380)">
      <rect width="700" height="130" rx="16" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="2.5"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#ffffff">Try a bigger routed model</text>
      <text x="24" y="74" font-size="14" fill="#c0c0d0">The DGX Spark&#8217;s 128GB has room for a</text>
      <text x="24" y="96" font-size="14" fill="#c0c0d0">larger model for harder tasks.</text>
    </g>
    <g transform="translate(820,380)">
      <rect width="700" height="130" rx="16" fill="#ec4899" fill-opacity="0.16" stroke="#ec4899" stroke-width="2.5"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#ffffff">Add scheduled tasks</text>
      <text x="24" y="74" font-size="14" fill="#c0c0d0">A cron trigger that wakes your agent up</text>
      <text x="24" y="96" font-size="14" fill="#c0c0d0">daily instead of waiting to be asked.</text>
    </g>
    <g transform="translate(100,540)">
      <rect width="700" height="130" rx="16" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-width="2.5"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#ffffff">Build a small dashboard</text>
      <text x="24" y="74" font-size="14" fill="#c0c0d0">Wrap `systemctl status` and `journalctl`</text>
      <text x="24" y="96" font-size="14" fill="#c0c0d0">into something easier to check daily.</text>
    </g>
    <g transform="translate(820,540)">
      <rect width="700" height="130" rx="16" fill="#16a34a" fill-opacity="0.16" stroke="#16a34a" stroke-width="2.5"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#ffffff">Share what you build</text>
      <text x="24" y="74" font-size="14" fill="#c0c0d0">Email jayaram.linux@gmail.com &#8212; we&#8217;ll feature</text>
      <text x="24" y="96" font-size="14" fill="#c0c0d0">real agents built by this cohort on saturdai.com.</text>
    </g>
  </g>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent Day 7: Deploy</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">9 / 10</text>
</svg>
