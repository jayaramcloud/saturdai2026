<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">What You Built: Your Digital Agent</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Working and learning for you, 24x7.</text>

  <circle cx="800" cy="470" r="120" fill="#16a34a" fill-opacity="0.22" stroke="#16a34a" stroke-width="3"/>
  <text x="800" y="462" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Your Hermes</text>
  <text x="800" y="490" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Agent</text>

  <g font-size="14">
    <line x1="800" y1="350" x2="800" y2="240" stroke="#a0a0c0" stroke-width="2"/>
    <g transform="translate(660,150)">
      <rect width="280" height="90" rx="14" fill="#5b7cfa" fill-opacity="0.16" stroke="#5b7cfa" stroke-width="2"/>
      <text x="20" y="34" font-size="16" font-weight="700" fill="#ffffff">Routes between models</text>
      <text x="20" y="60" font-size="13" fill="#c0c0d0">picks the right size for the job</text>
    </g>

    <line x1="920" y1="420" x2="1080" y2="330" stroke="#a0a0c0" stroke-width="2"/>
    <g transform="translate(1090,240)">
      <rect width="280" height="90" rx="14" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="2"/>
      <text x="20" y="34" font-size="16" font-weight="700" fill="#ffffff">Retrieves real documents</text>
      <text x="20" y="60" font-size="13" fill="#c0c0d0">grounded answers, not guesses</text>
    </g>

    <line x1="920" y1="520" x2="1080" y2="600" stroke="#a0a0c0" stroke-width="2"/>
    <g transform="translate(1090,590)">
      <rect width="280" height="90" rx="14" fill="#ec4899" fill-opacity="0.16" stroke="#ec4899" stroke-width="2"/>
      <text x="20" y="34" font-size="16" font-weight="700" fill="#ffffff">Calls external tools</text>
      <text x="20" y="60" font-size="13" fill="#c0c0d0">via MCP, not hallucinated results</text>
    </g>

    <line x1="680" y1="520" x2="520" y2="600" stroke="#a0a0c0" stroke-width="2"/>
    <g transform="translate(230,590)">
      <rect width="280" height="90" rx="14" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-width="2"/>
      <text x="20" y="34" font-size="16" font-weight="700" fill="#ffffff">Loops until done</text>
      <text x="20" y="60" font-size="13" fill="#c0c0d0">multi-step tasks, not one reply</text>
    </g>

    <line x1="680" y1="420" x2="520" y2="330" stroke="#a0a0c0" stroke-width="2"/>
    <g transform="translate(230,240)">
      <rect width="280" height="90" rx="14" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="2"/>
      <text x="20" y="34" font-size="16" font-weight="700" fill="#ffffff">Keeps running, 24x7</text>
      <text x="20" y="60" font-size="13" fill="#c0c0d0">deployed as a managed service</text>
    </g>
  </g>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent Day 7: Deploy</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">8 / 10</text>
</svg>
