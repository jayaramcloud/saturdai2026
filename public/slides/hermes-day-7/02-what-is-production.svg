<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">What "Production" Actually Means</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Persistence and uptime &#8212; not just answering one prompt and exiting.</text>

  <!-- Left: one-shot -->
  <g transform="translate(120,220)">
    <rect width="620" height="560" rx="20" fill="#f5576c" fill-opacity="0.12" stroke="#f5576c" stroke-width="2.5"/>
    <text x="36" y="54" font-size="22" font-weight="700" fill="#f5576c">One-Shot Hermes</text>
    <text x="36" y="110" font-size="16" fill="#ffffff">$ hermes -z "..." --cli</text>
    <rect x="36" y="140" width="548" height="2" fill="#ffffff" fill-opacity="0.15"/>
    <text x="36" y="180" font-size="15" fill="#c0c0d0">&#8226; Runs once, prints an answer, exits</text>
    <text x="36" y="212" font-size="15" fill="#c0c0d0">&#8226; Dies the moment your terminal closes</text>
    <text x="36" y="244" font-size="15" fill="#c0c0d0">&#8226; No memory of being interrupted</text>
    <text x="36" y="276" font-size="15" fill="#c0c0d0">&#8226; Nothing restarts it if it crashes</text>
    <text x="36" y="308" font-size="15" fill="#c0c0d0">&#8226; Great for demos and labs (Days 2&#8211;6)</text>
    <text x="36" y="340" font-size="15" fill="#c0c0d0">&#8226; Not something you can rely on overnight</text>
  </g>

  <!-- Right: production -->
  <g transform="translate(860,220)">
    <rect width="620" height="560" rx="20" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a" stroke-width="2.5"/>
    <text x="36" y="54" font-size="22" font-weight="700" fill="#4ade80">Production Hermes</text>
    <text x="36" y="110" font-size="16" fill="#ffffff">$ systemctl status hermes-agent</text>
    <rect x="36" y="140" width="548" height="2" fill="#ffffff" fill-opacity="0.15"/>
    <text x="36" y="180" font-size="15" fill="#c0c0d0">&#8226; Runs as a managed background service</text>
    <text x="36" y="212" font-size="15" fill="#c0c0d0">&#8226; Keeps running after you log out</text>
    <text x="36" y="244" font-size="15" fill="#c0c0d0">&#8226; Its config (endpoint, MCPs, RAG) survives a restart</text>
    <text x="36" y="276" font-size="15" fill="#c0c0d0">&#8226; A supervisor restarts it automatically on crash</text>
    <text x="36" y="308" font-size="15" fill="#c0c0d0">&#8226; What "24x7 digital agent" actually requires</text>
    <text x="36" y="340" font-size="15" fill="#c0c0d0">&#8226; Today&#8217;s goal, built on the DGX Spark / Mac Mini</text>
  </g>

  <text x="800" y="500" font-size="34" font-weight="800" fill="#a0a0c0" text-anchor="middle">&#8594;</text>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent Day 7: Deploy</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">2 / 10</text>
</svg>
