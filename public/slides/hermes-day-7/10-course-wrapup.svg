<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-size="40" font-weight="800" fill="url(#titleGrad)">Course Recap</text>
  <text x="80" y="130" font-size="22" fill="#a0a0c0">Seven sessions, one working, deployed Hermes agent.</text>

  <g font-size="15">
    <g transform="translate(100,200)">
      <circle cx="14" cy="14" r="14" fill="#5b7cfa"/>
      <text x="40" y="20" font-size="17" fill="#ffffff">Hermes talks to any OpenAI-compatible endpoint, local or cloud.</text>
    </g>
    <g transform="translate(100,250)">
      <circle cx="14" cy="14" r="14" fill="#0d9488"/>
      <text x="40" y="20" font-size="17" fill="#ffffff">Route requests to the right model instead of one-size-fits-all.</text>
    </g>
    <g transform="translate(100,300)">
      <circle cx="14" cy="14" r="14" fill="#d97706"/>
      <text x="40" y="20" font-size="17" fill="#ffffff">RAG grounds answers in real documents, not guesses.</text>
    </g>
    <g transform="translate(100,350)">
      <circle cx="14" cy="14" r="14" fill="#ec4899"/>
      <text x="40" y="20" font-size="17" fill="#ffffff">MCP servers connect Hermes to real external systems.</text>
    </g>
    <g transform="translate(100,400)">
      <circle cx="14" cy="14" r="14" fill="#8b5cf6"/>
      <text x="40" y="20" font-size="17" fill="#ffffff">Agent loops let Hermes chain tool calls until a task is done.</text>
    </g>
    <g transform="translate(100,450)">
      <circle cx="14" cy="14" r="14" fill="#16a34a"/>
      <text x="40" y="20" font-size="17" fill="#ffffff">Deployed as a service, it keeps working after you log off.</text>
    </g>
  </g>

  <rect x="100" y="520" width="1400" height="220" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="800" y="600" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">Thank you for building with us. &#127881;</text>
  <text x="800" y="640" font-size="17" fill="#c0c0d0" text-anchor="middle">Keep going &#8212; questions any time at jayaram.linux@gmail.com.</text>
  <text x="800" y="670" font-size="17" fill="#c0c0d0" text-anchor="middle">Your digital agent is running. Now go put it to work.</text>

  <text x="80" y="860" font-size="14" fill="#8888aa">SaturdAI &#183; Hermes Agent Day 7: Deploy</text>
  <text x="1520" y="860" font-size="14" fill="#8888aa" text-anchor="end">10 / 10</text>
</svg>
